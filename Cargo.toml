[package]
name = "factorio_planner_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
